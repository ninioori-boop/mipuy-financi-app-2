# CI — the same gate the ship skill runs by hand, on every push.
# Until 2026-08-05 NOTHING ran tests before code reached paying clients
# (Vercel builds, but never runs tsc/vitest). This is advisory (no branch
# protection), but a red X on main is a stop-everything signal.
#
# NOT here yet, deliberately:
#  - Playwright E2E (day-17 scope; specs preserved in archive/businessdb-growth)
name: CI

on:
  push:
    # ci/** lets CI-infrastructure branches prove themselves BEFORE merging —
    # rules tests can't run locally (no JRE), so their first execution must
    # not be on main.
    branches: [main, 'ci/**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Functions syntax
        run: node --check functions/index.js

      - name: Functions tree guard
        run: node scripts/check-functions-tree.js

      - name: Build
        run: npm run build
        env:
          # Dummy values — without them the prerender fails on
          # auth/invalid-api-key (see the ship skill). Real values are never
          # needed to prove the build compiles.
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy-key-for-build
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0'

  # Firestore security rules against the emulator — the rules had ZERO
  # automated coverage until 2026-08-06 (no JRE on the dev machine; ubuntu
  # runners ship Java preinstalled). Separate job: the emulator download +
  # boot must not slow the main checks, and a rules failure should be
  # identifiable at a glance.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Firestore rules tests (emulator)
        run: npx -y firebase-tools emulators:exec --only firestore --project demo-rules-test "npx vitest run --config vitest.rules.config.ts"
